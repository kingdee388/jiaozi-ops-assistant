  var categories = [];
  var catMap = {};
  KB.forEach(function(item) {
    if (!catMap[item.category]) {
      catMap[item.category] = item.catClass;
      categories.push({ name: item.category, cls: item.catClass });
    }
  });

  function renderSuggestions() {
    var html = '';
    sugs.forEach(function(s) {
      html += '<span onclick="doSuggestSearch(' + JSON.stringify(s.q) + ')">' + escapeHtml(s.q) + '</span>';
    });
    document.getElementById('suggestions').innerHTML = html;
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderCategoryTabs() {
    var html = '<button class="active" onclick="filterCategory('')">全部</button>';
    categories.forEach(function(c) {
      html += '<button onclick="filterCategory(' + JSON.stringify(c.name) + ')">' + escapeHtml(c.name) + '</button>';
    });
    document.getElementById('categoryTabs').innerHTML = html;
  }

  var currentCategory = '';
  var currentSearch = '';

  function doSuggestSearch(q) {
    document.getElementById('searchInput').value = q;
    doSearch();
  }

  function filterCategory(cat) {
    currentCategory = cat;
    var btns = document.querySelectorAll('.category-tabs button');
    btns.forEach(function(b) {
      b.classList.remove('active');
      if ((cat === '' && b.textContent === '全部') || b.textContent === cat) {
        b.classList.add('active');
      }
    });
    doSearch();
  }

  function highlightText(text, keyword) {
    if (!keyword) return escapeHtml(text);
    var escaped = escapeHtml(text);
    var parts = escaped.split(new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'));
    return parts.map(function(p) {
      return p.toLowerCase() === keyword.toLowerCase()
        ? '<span class="highlight">' + p + '</span>' : p;
    }).join('');
  }

  function doSearch() {
    var input = document.getElementById('searchInput').value.trim().toLowerCase();
    currentSearch = input;
    var keywords = input ? input.split(/[\s,，]+/) : [];

    var filtered = KB.filter(function(item) {
      if (currentCategory && item.category !== currentCategory) return false;
      if (keywords.length === 0) return true;
      var text = (item.q + ' ' + item.category + ' ' + item.keywords.join(' ') + ' ' + item.a).toLowerCase();
      return keywords.every(function(k) { return k === '' || text.indexOf(k) !== -1; });
    });

    document.getElementById('resultCount').textContent = '共 ' + filtered.length + ' 条结果';

    if (filtered.length === 0) {
      var keyword = encodeURIComponent(input);
      document.getElementById('faqList').innerHTML = '<div class="no-result">未找到相关结果，试试搜索 <a href="https://vip.kingdee.com/search?keyword=' + keyword + '" target="_blank">金蝶云社区</a></div>';
      return;
    }

    var html = '';
    filtered.forEach(function(item) {
      var qText = input ? highlightText(item.q, input) : escapeHtml(item.q);
      html += '<div class="faq-item ' + item.catClass + '" onclick="toggleAnswer(this)">';
      html += '<div class="faq-cat">' + escapeHtml(item.category) + '</div>';
      html += '<div class="faq-q">' + qText + '</div>';
      html += '<div class="faq-a">' + item.a + '</div>';
      html += '</div>';
    });
    document.getElementById('faqList').innerHTML = html;
  }

  function toggleAnswer(el) {
    el.classList.toggle('open');
  }

  renderSuggestions();
  renderCategoryTabs();
  doSearch();
</script>
